[project]
name = "herdr-mcp"
version = "0.1.0"
description = "MCP server that exposes a running Herdr terminal session to coding agents"
readme = "README.md"
authors = [
    { name = "Amir Elaguizy", email = "aelaguiz@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "mcp>=2,<3",
]

[project.scripts]
herdr-mcp = "herdr_mcp.server:main"

[build-system]
requires = ["uv_build>=0.11.1,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "anyio>=4.11.0",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
